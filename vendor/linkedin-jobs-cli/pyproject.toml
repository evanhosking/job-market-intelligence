[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-jobs-cli"
version = "0.1.0"
description = "A clean-room CLI for LinkedIn's public guest jobs search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.scripts]
linkedin-jobs = "linkedin_jobs_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_jobs_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
