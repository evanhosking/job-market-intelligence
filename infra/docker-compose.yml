services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["market_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  market_data:
