[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Personal, auditable job market observations collected with linkedin-jobs-cli"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3", "linkedin-jobs-cli", "httpx>=0.27,<1"]
[project.scripts]
market = "market.cli:main"
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9", "mypy>=1.13"]
[tool.uv.sources]
linkedin-jobs-cli = { path = "vendor/linkedin-jobs-cli", editable = true }
[tool.hatch.build.targets.wheel]
packages = ["src/market"]
[tool.pytest.ini_options]
testpaths = ["tests", "vendor/linkedin-jobs-cli/tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
packages = ["market"]
ignore_missing_imports = true
check_untyped_defs = true
